# ─── TEST PROFILE ────────────────────────────────────────────────────────────────
# This overrides application.yml during test execution.
# H2 replaces Postgres; EmbeddedRedis replaces the real Redis server.

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6370                      # EmbeddedRedis will bind to this port in tests

payment:
  idempotency:
    ttl-seconds: 300                  # Short TTL in tests so they don't linger